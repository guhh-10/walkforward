[tool.ruff]
line-length = 88
src = ["app"]
target-version = "py310"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E",   # Common Python style errors
    "F",   # Undefined names, unused imports, and related errors
    "W",   # Common warnings
    "B",   # Likely bugs and suspicious patterns
    "UP",  # Outdated Python syntax
    "I",   # Import sorting
    "SIM", # Suspicious or unnecessarily complicated code
    "RUF", # Ruff-specific checks
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
